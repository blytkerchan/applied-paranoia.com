
name: Dependabot Auto-Approve

concurrency:
  group: dependabot-auto-approve-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: read
  workflows: write

jobs:
  auto-approve:
    if: github.actor == 'dependabot[bot]' && (github.base_ref == 'dev' || github.base_ref == 'prod')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Verify site output safety
        run: |
          test ! -e _site/infra
          test ! -e _site/functions
          test ! -e _site/.github
          test ! -e _site/.devcontainer
          test ! -e _site/README.md
          test ! -e _site/build.ps1
          test ! -e _site/serve.ps1
          test ! -e _site/Gemfile
          test ! -e _site/Gemfile.lock
          test ! -e _site/package.json
          test ! -e _site/package-lock.json
          test ! -e _site/serverless.yml

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve on dev
        if: github.base_ref == 'dev'
        run: gh pr review "${{ github.event.pull_request.number }}" --approve --body "Auto-approved after successful build."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge and close on dev
        if: github.base_ref == 'dev'
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve minor/patch on prod
        if: github.base_ref == 'prod' && (steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: gh pr review "${{ github.event.pull_request.number }}" --approve --body "Auto-approved (minor/patch) after successful build."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge and close minor/patch on prod
        if: github.base_ref == 'prod' && (steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
