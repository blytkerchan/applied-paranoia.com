name: Build Jekyll Site

on:
  push:
    branches:
      - dev
      - prod
  pull_request:
    branches:
      - dev
      - prod
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Verify site output safety
        run: |
          test ! -e _site/infra
          test ! -e _site/functions
          test ! -e _site/.github
          test ! -e _site/.devcontainer
          test ! -e _site/README.md
          test ! -e _site/build.ps1
          test ! -e _site/serve.ps1
          test ! -e _site/Gemfile
          test ! -e _site/Gemfile.lock
          test ! -e _site/package.json
          test ! -e _site/package-lock.json
          test ! -e _site/serverless.yml

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
