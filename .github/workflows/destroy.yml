name: Destroy Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: Type DESTROY to confirm
        required: true
        type: string
      target_branch:
        description: Branch deployment to destroy (must not be prod)
        required: true
        default: dev
        type: string

permissions:
  contents: read

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.resolve.outputs.stage }}
      env_name: ${{ steps.resolve.outputs.env_name }}
      state_key: ${{ steps.resolve.outputs.state_key }}
      env_exists: ${{ steps.resolve.outputs.env_exists }}
      target_branch: ${{ steps.resolve.outputs.target_branch }}
      destroy_allowed: ${{ steps.resolve.outputs.destroy_allowed }}
    steps:
      - name: Resolve destroy target
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TARGET_BRANCH="${{ github.event.inputs.target_branch }}"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"

          if [[ "$TARGET_BRANCH" == "prod" ]]; then
            echo "destroy_allowed=false" >> "$GITHUB_OUTPUT"
            echo "env_exists=false" >> "$GITHUB_OUTPUT"
            echo "env_name=prod" >> "$GITHUB_OUTPUT"
            echo "stage=prod" >> "$GITHUB_OUTPUT"
            echo "state_key=${{ vars.AWS_STATE_KEY_PROD }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH_SLUG=$(echo "$TARGET_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')
          if [[ -z "$BRANCH_SLUG" ]]; then
            BRANCH_SLUG="preview"
          fi

          ENV_NAME="$BRANCH_SLUG"
          BASE_STATE_KEY="${{ vars.AWS_STATE_KEY_DEV }}"
          if [[ "$BRANCH_SLUG" == "dev" ]]; then
            STATE_KEY="$BASE_STATE_KEY"
          elif [[ "$BASE_STATE_KEY" == *.tfstate ]]; then
            STATE_KEY="${BASE_STATE_KEY%.tfstate}-${BRANCH_SLUG}.tfstate"
          else
            STATE_KEY="${BASE_STATE_KEY}-${BRANCH_SLUG}.tfstate"
          fi

          STAGE_HASH=$(printf '%s' "${GITHUB_REPOSITORY}:${TARGET_BRANCH}" | sha256sum | cut -c1-10)
          STAGE="dev-${STAGE_HASH}"

          ENV_URI=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$ENV_NAME")
          if gh api "repos/${REPO}/environments/${ENV_URI}" >/dev/null 2>&1; then
            ENV_EXISTS="true"
          else
            ENV_EXISTS="false"
          fi

          echo "destroy_allowed=true" >> "$GITHUB_OUTPUT"
          echo "env_exists=$ENV_EXISTS" >> "$GITHUB_OUTPUT"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "state_key=$STATE_KEY" >> "$GITHUB_OUTPUT"

  destroy:
    if: github.event.inputs.confirm_destroy == 'DESTROY' && needs.resolve-target.outputs.destroy_allowed == 'true' && needs.resolve-target.outputs.env_exists == 'true'
    needs: [resolve-target]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve-target.outputs.env_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform destroy plan/apply
        working-directory: infra
        run: |
          cat > ci.auto.tfvars <<EOF
          aws_region = "${{ vars.AWS_REGION }}"
          stage = "${{ needs.resolve-target.outputs.stage }}"
          root_domain = "${{ vars.ROOT_DOMAIN }}"
          acm_certificate_arn = "${{ vars.ACM_CERTIFICATE_ARN }}"
          EOF

          terraform init \
            -backend-config="bucket=${{ vars.AWS_STATE_BUCKET }}" \
            -backend-config="key=${{ needs.resolve-target.outputs.state_key }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -reconfigure -upgrade

          terraform plan -destroy --var-file=ci.auto.tfvars --out=destroy.tfplan
          terraform apply destroy.tfplan

  skip-destroy:
    if: github.event.inputs.confirm_destroy == 'DESTROY' && (needs.resolve-target.outputs.destroy_allowed != 'true' || needs.resolve-target.outputs.env_exists != 'true')
    needs: [resolve-target]
    runs-on: ubuntu-latest
    steps:
      - name: Write skipped summary
        run: |
          {
            echo "## Destroy skipped"
            echo ""
            echo "- Target branch: ${{ needs.resolve-target.outputs.target_branch }}"
            echo "- Expected environment: ${{ needs.resolve-target.outputs.env_name }}"
            if [[ "${{ needs.resolve-target.outputs.destroy_allowed }}" != "true" ]]; then
              echo "- Reason: destroying prod is not allowed."
            else
              echo "- Reason: GitHub Environment does not exist."
            fi
          } >> "$GITHUB_STEP_SUMMARY"