name: Deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev]

permissions:
  actions: read
  contents: read

env:
  REPO: ${{ github.repository }}

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.resolve.outputs.stage }}
      env_name: ${{ steps.resolve.outputs.env_name }}
      state_key: ${{ steps.resolve.outputs.state_key }}
      env_exists: ${{ steps.resolve.outputs.env_exists }}
      branch_name: ${{ steps.resolve.outputs.branch_name }}
    steps:
      - name: Resolve branch target
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"

          if [[ "$BRANCH" == "prod" ]]; then
            STAGE="prod"
            ENV_NAME="prod"
            STATE_KEY="${{ vars.AWS_STATE_KEY_PROD }}"
          else
            BRANCH_SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')
            if [[ -z "$BRANCH_SLUG" ]]; then
              BRANCH_SLUG="preview"
            fi

            ENV_NAME="$BRANCH_SLUG"

            BASE_STATE_KEY="${{ vars.AWS_STATE_KEY_DEV }}"
            if [[ "$BRANCH_SLUG" == "dev" ]]; then
              STATE_KEY="$BASE_STATE_KEY"
            elif [[ "$BASE_STATE_KEY" == *.tfstate ]]; then
              STATE_KEY="${BASE_STATE_KEY%.tfstate}-${BRANCH_SLUG}.tfstate"
            else
              STATE_KEY="${BASE_STATE_KEY}-${BRANCH_SLUG}.tfstate"
            fi

            STAGE_HASH=$(printf '%s' "${GITHUB_REPOSITORY}:${BRANCH}:${GITHUB_RUN_ID}" | sha256sum | cut -c1-10)
            STAGE="dev-${STAGE_HASH}"
          fi

          ENV_URI=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$ENV_NAME")
          if gh api "repos/${REPO}/environments/${ENV_URI}" >/dev/null 2>&1; then
            ENV_EXISTS="true"
          else
            ENV_EXISTS="false"
          fi

          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "state_key=$STATE_KEY" >> "$GITHUB_OUTPUT"
          echo "env_exists=$ENV_EXISTS" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Verify site output safety
        run: |
          test ! -e _site/infra
          test ! -e _site/functions
          test ! -e _site/.github
          test ! -e _site/.devcontainer
          test ! -e _site/README.md
          test ! -e _site/build.ps1
          test ! -e _site/serve.ps1
          test ! -e _site/Gemfile
          test ! -e _site/Gemfile.lock
          test ! -e _site/package.json
          test ! -e _site/package-lock.json
          test ! -e _site/serverless.yml

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  detect-infra:
    runs-on: ubuntu-latest
    outputs:
      infra_changed: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'infra/**'

  check-state:
    runs-on: ubuntu-latest
    needs: [resolve-target]
    if: needs.resolve-target.outputs.env_exists == 'true'
    outputs:
      state_exists: ${{ steps.state.outputs.state_exists }}
      state_ready: ${{ steps.state.outputs.state_ready }}
      effective_stage: ${{ steps.state.outputs.effective_stage }}
      expected_url: ${{ steps.state.outputs.expected_url }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check Terraform state object
        id: state
        run: |
          GENERATED_STAGE="${{ needs.resolve-target.outputs.stage }}"
          EFFECTIVE_STAGE="$GENERATED_STAGE"
          EXPECTED_URL=""

          if aws s3api head-object \
            --bucket "${{ vars.AWS_STATE_BUCKET }}" \
            --key "${{ needs.resolve-target.outputs.state_key }}" >/dev/null 2>&1; then
            echo "state_exists=true" >> "$GITHUB_OUTPUT"

            STATE_JSON=$(aws s3 cp "s3://${{ vars.AWS_STATE_BUCKET }}/${{ needs.resolve-target.outputs.state_key }}" - 2>/dev/null || true)
            BUCKET=$(printf '%s' "$STATE_JSON" | jq -r '.outputs.s3_bucket_name.value // empty' 2>/dev/null || true)
            DIST=$(printf '%s' "$STATE_JSON" | jq -r '.outputs.cloudfront_distribution_id.value // empty' 2>/dev/null || true)
            SITE=$(printf '%s' "$STATE_JSON" | jq -r '.outputs.site_name.value // empty' 2>/dev/null || true)

            if [[ -n "$BUCKET" && -n "$DIST" && -n "$SITE" ]]; then
              echo "state_ready=true" >> "$GITHUB_OUTPUT"

              if [[ "$SITE" == "${{ vars.ROOT_DOMAIN }}" ]]; then
                EFFECTIVE_STAGE="prod"
              else
                EFFECTIVE_STAGE="${SITE%.${{ vars.ROOT_DOMAIN }}}"
              fi

              EXPECTED_URL="https://$SITE"
            else
              echo "state_ready=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "state_exists=false" >> "$GITHUB_OUTPUT"
            echo "state_ready=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -z "$EXPECTED_URL" ]]; then
            if [[ "$EFFECTIVE_STAGE" == "prod" ]]; then
              EXPECTED_URL="https://${{ vars.ROOT_DOMAIN }}"
            else
              EXPECTED_URL="https://${EFFECTIVE_STAGE}.${{ vars.ROOT_DOMAIN }}"
            fi
          fi

          echo "effective_stage=$EFFECTIVE_STAGE" >> "$GITHUB_OUTPUT"
          echo "expected_url=$EXPECTED_URL" >> "$GITHUB_OUTPUT"

  terraform:
    runs-on: ubuntu-latest
    needs: [resolve-target, build, detect-infra, check-state]
    if: needs.resolve-target.outputs.env_exists == 'true' && (needs.detect-infra.outputs.infra_changed == 'true' || needs.check-state.outputs.state_ready != 'true')
    environment:
      name: ${{ needs.resolve-target.outputs.env_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init/plan/apply
        working-directory: infra
        run: |
          cat > ci.auto.tfvars <<EOF
          aws_region = "${{ vars.AWS_REGION }}"
          stage = "${{ needs.check-state.outputs.effective_stage }}"
          root_domain = "${{ vars.ROOT_DOMAIN }}"
          acm_certificate_arn = "${{ vars.ACM_CERTIFICATE_ARN }}"
          EOF

          terraform init \
            -backend-config="bucket=${{ vars.AWS_STATE_BUCKET }}" \
            -backend-config="key=${{ needs.resolve-target.outputs.state_key }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -reconfigure -upgrade

          terraform plan --var-file=ci.auto.tfvars --out=plan.tfplan
          terraform apply plan.tfplan

  deploy:
    runs-on: ubuntu-latest
    needs: [resolve-target, build, detect-infra, check-state, terraform]
    if: >-
      always() &&
      needs.resolve-target.outputs.env_exists == 'true' &&
      needs.build.result == 'success' &&
      (
        needs.terraform.result == 'success' ||
        (
          needs.terraform.result == 'skipped' &&
          needs.detect-infra.outputs.infra_changed != 'true' &&
          needs.check-state.outputs.state_ready == 'true'
        )
      )
    environment:
      name: ${{ needs.resolve-target.outputs.env_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Read Terraform outputs
        id: outputs
        working-directory: infra
        run: |
          HAS_OUTPUTS=true

          echo "url=${{ needs.check-state.outputs.expected_url }}" >> "$GITHUB_OUTPUT"

          terraform init \
            -backend-config="bucket=${{ vars.AWS_STATE_BUCKET }}" \
            -backend-config="key=${{ needs.resolve-target.outputs.state_key }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -reconfigure

          STATE_JSON=$(terraform state pull 2>/dev/null || true)

          BUCKET=$(printf '%s' "$STATE_JSON" | jq -r '.outputs.s3_bucket_name.value // empty' 2>/dev/null || true)
          DIST=$(printf '%s' "$STATE_JSON" | jq -r '.outputs.cloudfront_distribution_id.value // empty' 2>/dev/null || true)
          DOMAIN=$(printf '%s' "$STATE_JSON" | jq -r '.outputs.site_name.value // empty' 2>/dev/null || true)

          if [[ -n "$BUCKET" ]]; then
            echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          else
            HAS_OUTPUTS=false
          fi

          if [[ -n "$DIST" ]]; then
            echo "distribution=$DIST" >> "$GITHUB_OUTPUT"
          else
            HAS_OUTPUTS=false
          fi

          if [[ -n "$DOMAIN" ]]; then
            echo "url=https://$DOMAIN" >> "$GITHUB_OUTPUT"
          fi

          echo "has_outputs=$HAS_OUTPUTS" >> "$GITHUB_OUTPUT"

      - name: Sync site to S3
        if: steps.outputs.outputs.has_outputs == 'true'
        run: |
          aws s3 sync _site "s3://${{ steps.outputs.outputs.bucket }}" --delete

      - name: Invalidate CloudFront
        if: steps.outputs.outputs.has_outputs == 'true'
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution }}" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.outputs.outputs.distribution }}" \
            --id "$INVALIDATION_ID"

      - name: Write skipped deployment summary (no outputs)
        if: steps.outputs.outputs.has_outputs != 'true'
        run: |
          {
            echo "## Deployment skipped"
            echo ""
            echo "- Branch: ${{ needs.resolve-target.outputs.branch_name }}"
            echo "- Environment: ${{ needs.resolve-target.outputs.env_name }}"
            echo "- URL: ${{ steps.outputs.outputs.url }}"
            echo "- Reason: Terraform state has no outputs for this branch target."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write deployment summary
        if: steps.outputs.outputs.has_outputs == 'true'
        run: |
          {
            echo "## Deployment"
            echo ""
            echo "- Branch: ${{ needs.resolve-target.outputs.branch_name }}"
            echo "- Environment: ${{ needs.resolve-target.outputs.env_name }}"
            echo "- Stage: ${{ needs.check-state.outputs.effective_stage }}"
            echo "- URL: ${{ steps.outputs.outputs.url }}"
            echo "- Distribution ID: ${{ steps.outputs.outputs.distribution }}"
            echo "- Bucket: ${{ steps.outputs.outputs.bucket }}"
            echo "- Infra changed: ${{ needs.detect-infra.outputs.infra_changed }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write deploy diagnostics
        if: always()
        run: |
          {
            echo "## Deploy diagnostics"
            echo ""
            echo "- State key: ${{ needs.resolve-target.outputs.state_key }}"
            echo "- Environment exists: ${{ needs.resolve-target.outputs.env_exists }}"
            echo "- Infra changed: ${{ needs.detect-infra.outputs.infra_changed }}"
            echo "- Terraform result: ${{ needs.terraform.result }}"
            echo "- State exists: ${{ needs.check-state.outputs.state_exists }}"
            echo "- State ready: ${{ needs.check-state.outputs.state_ready }}"
            echo "- Effective stage: ${{ needs.check-state.outputs.effective_stage }}"
            echo "- Has outputs: ${{ steps.outputs.outputs.has_outputs }}"
          } >> "$GITHUB_STEP_SUMMARY"

  skip-missing-environment:
    runs-on: ubuntu-latest
    needs: [resolve-target, build]
    if: needs.resolve-target.outputs.env_exists != 'true' && needs.build.result == 'success'
    steps:
      - name: Write skipped summary
        run: |
          {
            echo "## Deployment skipped"
            echo ""
            echo "- Branch: ${{ needs.resolve-target.outputs.branch_name }}"
            echo "- Expected environment: ${{ needs.resolve-target.outputs.env_name }}"
            echo "- Reason: GitHub Environment does not exist."
          } >> "$GITHUB_STEP_SUMMARY"
