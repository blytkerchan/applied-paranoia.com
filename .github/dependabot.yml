version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(ruby)"

  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(devcontainer)"

  - package-ecosystem: "bundler"
    directory: "/"
    target-branch: "prod"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(ruby)"

  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "prod"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(devcontainer)"
